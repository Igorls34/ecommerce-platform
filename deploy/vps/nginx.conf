# Nginx para a VPS da Thessara.

server {
    listen 80;
    server_name thessarasemijoias.com.br www.thessarasemijoias.com.br admin.thessarasemijoias.com.br api.thessarasemijoias.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.thessarasemijoias.com.br;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/thessarasemijoias.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thessarasemijoias.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name thessarasemijoias.com.br www.thessarasemijoias.com.br;
    root /var/www/thessara/frontend-store/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/thessarasemijoias.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thessarasemijoias.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /sitemap.xml {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /store {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* ^/(images|brand)/.*\.(?:png|jpe?g|webp|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~* ^/(?:favicon|thessara-favicon|apple-touch-icon|og-thessara).*\.(?:png|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

