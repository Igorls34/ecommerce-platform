<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Painel Administrativo</title>
  <link rel="stylesheet" href="../styles/global.css">
</head>
<body>
  <main class="page" style="min-height: 100vh; display: grid; place-items: center; padding: 24px;">
    <section class="panel" style="width: 100%; max-width: 420px;">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Painel Administrativo</p>
          <h1 style="font-size: 1.8rem;">Entrar</h1>
        </div>
      </div>

      <div class="panel-body">
        <form id="loginForm" class="form-layout">
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>

          <button type="submit" class="button button-primary">Entrar</button>
        </form>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
